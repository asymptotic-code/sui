reasoning: 'This is a SPEC gap (a), not a code defect (b). The code (staking_pool.move:568)
  is `transfer::transfer(stake.split(split_amount, ctx), ctx.sender())` — the recipient
  is the literal expression ctx.sender(), with no field read, arithmetic, indirection,
  or branch that could divert it; stake.split() correctly builds the new StakedSui
  (pool_id/epoch copied, principal=split_amount). So the implementation is incapable
  of sending to the wrong address as written, which rules out (b). The spec, however,
  calls ghost::declare_global_mut for both SpecTransferAddressExists and SpecTransferAddress
  (lines 188-189) but never reads either in any ensures — its only postconditions
  constrain the *original* stake''s amount, pool_id, and epoch. I confirmed the ghost
  wiring is live and would make a read provable: transfer::transfer routes through
  transfer_impl (sui-framework transfer.move), and specs::transfer_spec::transfer_impl_spec
  (sui-prover stdlib packages/sui-specs/.../transfer.move) sets SpecTransferAddressExists=true
  and SpecTransferAddress=recipient. The declared-but-unread ghosts are dead spec
  code and a clear smoking gun that the author intended to assert the transfer destination
  (and the writeup lists ''new StakedSui transferred to ctx.sender()'' as an intended
  ensures) but never wrote the clause. Tightening the spec with ensures(ghost::global<SpecTransferAddressExists,bool>()
  == true) and ensures(ghost::global<SpecTransferAddress,address>() == ctx.sender())
  would still pass — it would not expose a system bug — which is exactly why issue_in
  is ''spec''. Severity is downgraded from high to medium: the missing postcondition
  is a genuine coverage hole on a user-facing entry function that moves an asset,
  and is worth fixing for completeness and regression-safety, but it masks no present,
  exploitable defect because the destination is hardcoded correctly. The spec is also
  silent on the split-off object''s own properties (principal==split_amount, pool_id,
  epoch), a related gap beyond the narrowly-raised transfer-destination point.'
