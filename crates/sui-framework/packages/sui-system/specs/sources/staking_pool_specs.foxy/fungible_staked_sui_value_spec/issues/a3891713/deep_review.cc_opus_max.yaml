reasoning: 'This is case (a): a genuine but trivial SPEC gap, not a code defect. The
  spec (staking_pool_specs.move:33-38) contains no `ensures`, so the only thing it
  proves is abort-freedom — which is vacuously true for a field read. It verifies
  nothing about the return value and would pass identically for an implementation
  that returned any other u64; the writeup itself names the missing postcondition
  (`result == fungible_staked_sui.value`). So the issue is real, not a false positive:
  `no_opaque` only inlines the body (prover sees `result = fungible_staked_sui.value`)
  but never checks it against anything without an `ensures`.


  It cannot be (b). The target (staking_pool.move:511-513) is a one-line accessor
  returning `fungible_staked_sui.value`, with no arithmetic, branching, mutation,
  or callees (all_accesses is None, callees empty). The `value` field (struct at line
  89-94) is documented as ''The pool token amount,'' which is exactly what the getter
  returns. There is no program point where a defect could hide, and adding `ensures(result
  == <value accessor>)` would pass immediately — tightening the spec is provably guaranteed
  NOT to expose any underlying bug, which is the discriminator for (a) over (b).


  Severity downgraded from high to medium. On the one hand the spec is 100% vacuous
  on a foundational getter — it is the observable quantity used by the sibling join/split
  specs (staking_pool_specs.move:96-97 and the assert at line 177) and across redeem,
  so a ✅ marker here overstates real coverage. On the other hand the property is the
  most trivial possible and the code is correct by inspection, so the gap masks zero
  code risk. That combination — real vacuous-spec gap worth fixing, but no plausible
  defect behind it — is medium, not high. Confidence is high: the absence of `ensures`
  and the triviality of the accessor are both directly verified from source. The fix
  (a `#[test_only, ext(pure)]` value accessor plus `ensures(result == accessor(fungible_staked_sui))`)
  is the right shape and standard for exposing a private field to a cross-module spec,
  but fixing is out of scope for this triage.'
