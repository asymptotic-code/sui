reasoning: 'Verdict (a): this is a spec-completeness gap, not a code defect. The target
  join_staked_sui is four lines whose only mutation is self.principal.join(principal)
  -- Balance::join is monotone u64 addition, so post-join staked_sui_amount(self)
  = old_self + old_other >= old_self. If the 1-SUI minimum held on entry it holds
  after, trivially; no path (including the overflow case already covered by the existing
  asserts) can lower self below the threshold. So there is nothing for the code to
  get wrong here -- firmly NOT (b). On the spec side the observation is technically
  correct: join_staked_sui_spec has only two asserts (metadata equality + overflow)
  and ZERO ensures, whereas the project convention -- see the sibling split_staked_sui_spec
  at lines 182-200 -- captures pre-state and ensures the exact arithmetic plus pool_id
  / stake_activation_epoch frame conditions. The genuinely valuable missing postconditions
  are therefore ensures(staked_sui_amount(self) == old_self + old_other) and the two
  frame ensures (pool_id, stake_activation_epoch unchanged) -- NOT the MIN_STAKING_THRESHOLD
  line the issue singles out. That specific ensures is the weakest part of the gap:
  I grepped the spec file and there is no inv_target datatype invariant on StakedSui
  (MIN_STAKING_THRESHOLD appears only inside the split asserts), so the prover does
  not know staked_sui_amount(self) >= MIN_STAKING_THRESHOLD on entry. Stating it as
  an ensures would fail to verify unless a requires(staked_sui_amount(self) >= MIN_STAKING_THRESHOLD)
  precondition is first added, and once added it degenerates to requires P implies
  ensures P under monotone addition -- pure documentation that proves nothing about
  the function''s behavior. Hence severity low and confidence high that this is a
  (minor) spec gap, with the real fix being the arithmetic + frame ensures rather
  than the threshold restatement.'
