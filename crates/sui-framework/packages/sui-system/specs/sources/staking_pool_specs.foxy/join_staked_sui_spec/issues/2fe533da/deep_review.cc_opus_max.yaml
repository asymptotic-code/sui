reasoning: 'TRUE issue, and it is squarely (a) a SPEC gap — not a code defect. I read
  the actual source: StakedSui (staking_pool.move L75-83) has fields {id: UID, pool_id:
  ID, stake_activation_epoch: u64, principal: Balance<SUI>}. join_staked_sui (L578-585)
  does only two things: `let StakedSui { id, principal, .. } = other; id.delete();
  self.principal.join(principal);`. The single write to `self` is `self.principal`
  via Balance::join; the implementation never assigns `self.pool_id` or `self.stake_activation_epoch`,
  so those fields are genuinely preserved. The review''s ''an implementation overwriting
  self''s metadata from other would go undetected'' is a hypothetical about a future
  regression, not the current code. Hence adding `let old=clone!(self); ensures(self.pool_id==old.pool_id);
  ensures(self.stake_activation_epoch==old.stake_activation_epoch)` would PASS — tightening
  the spec exposes no system bug, which is exactly the test that confirms issue_in=''spec''.
  The gap is real because the spec body has ZERO ensures: it proves the two abort
  conditions (is_equal_staking_metadata, principal-sum overflow) but asserts nothing
  about the post-state. Its own writeup lists the intended ensures (pool_id unchanged,
  stake_activation_epoch unchanged, self.principal == old(self.principal)+old(other.principal));
  none are present. The narrowly-flagged frame ensures are the weakest part, but the
  missing principal-sum ensures is the larger co-existing gap. Severity medium, not
  high: code is correct, this is a leaf user-facing entry (callees=[], mutates only
  the caller''s own object, no protocol state) so the missing frame ensures has little
  downstream blast radius (unlikely to be include=''d as an opaque callee). Confidence
  high — verdict rests on directly reading the struct and the 6-line implementation.'
