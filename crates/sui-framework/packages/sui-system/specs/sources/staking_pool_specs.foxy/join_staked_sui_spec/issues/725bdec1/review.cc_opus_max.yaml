reasoning: 'The original issue was a spec gap: join_staked_sui_spec verified only
  abort behavior (two asserts) and had zero ensures, leaving the core merge-accounting
  property unproven. The current spec now captures old_self_amount and old_other_amount
  before the call and adds exactly the missing postcondition: ensures(staked_sui_amount(self).to_int()
  == old_self_amount.to_int().add(old_other_amount.to_int())). Since staked_sui_amount(s)
  is literally s.principal.value() (staking_pool.move:483), this ensures is precisely
  the principal-conservation property the issue and triage demanded — an implementation
  that dropped, double-counted, or mis-summed the joined principal would now fail.
  The implementation (assert metadata-equal; destructure other; delete UID; self.principal.join(principal))
  is a correct total merge whose only abort (overflow) is already guarded by the retained
  overflow assert, so tightening the spec exposed no code defect, exactly as triage
  predicted. The two original asserts are preserved (no weakening), and the ensures
  was added, not substituted. The narrowly-scoped pool_id / stake_activation_epoch
  frame ensures present in the sibling split_staked_sui_spec remain absent, but those
  were never part of this issue (which is solely about the merge accounting) and their
  absence is not a regression.'
evidence: 'Current spec body at specs/sources/staking_pool_specs.move contains `ensures(staking_pool::staked_sui_amount(self).to_int()
  == old_self_amount.to_int().add(old_other_amount.to_int()))` plus the original `asserts(is_equal_staking_metadata(...))`
  and the Integer-space overflow assert. Accessor confirmed: staking_pool.move:483
  `public fun staked_sui_amount(staked_sui: &StakedSui): u64 { staked_sui.principal.value()
  }`. Implementation confirmed at staking_pool.move:578-585 (textbook merge via self.principal.join(principal)).
  Cloud prover run over module staking_pool_specs returned exit_code=0, ''Verification
  successful'', with all three checks passing for the target: join_staked_sui_spec_Check,
  join_staked_sui_spec_Assume, join_staked_sui_spec_SpecNoAbortCheck all ✅; the rest
  of the module (split_staked_sui_spec, getters) also verified — no regression introduced.'
